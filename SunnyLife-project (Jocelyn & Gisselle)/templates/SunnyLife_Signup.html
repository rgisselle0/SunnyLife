<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Style_SunnyLife.css') }}">
</head>
<body>
    <div id="container">
        <div id="signup-box">
            <h1>Sign Up</h1>
            <form action="{{ url_for('create_account') }}" method="post">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <div style="flex: 0 0 48%; text-align: left;">
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" name="first_name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                    <div style="flex: 0 0 48%; text-align: left;">
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" name="last_name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <div style="flex: 0 0 48%; text-align: left;">
                        <label for="address">Shipping Address:</label>
                        <input type="text" id="address" name="address" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                    <div style="flex: 0 0 48%; text-align: left;">
                        <label for="Billing-Address">Billing Address:</label>
                        <input type="text" id="Billing-Address" name="Billing-Address" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <div style="flex: 0 0 48%; text-align: left;">
                        <label for="new-username">New Username:</label>
                        <input type="text" id="new-username" name="username" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                    <div style="flex: 0 0 48%; text-align: left;">
                        <label for="new-password">New Password:</label>
                        <input type="password" id="new-password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>
                </div>
                <button type="submit" id="btn">Sign Up</button>
                {% if msg %}
                    <p style="color:red;">{{ msg }}</p>
                {% endif %}
            </form>
            <p>Already have an account? <a href="{{ url_for('main') }}">Login</a></p>
        </div>
    </div>
</body>
</html>
