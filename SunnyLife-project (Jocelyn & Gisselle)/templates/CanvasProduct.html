<html>
<head>
	<title>Canvas</title>
	<link rel= "stylesheet" type= "text/css" href= "{{ url_for('static',filename='Custom.css') }}">
	<script src="{{ url_for('static', filename='javascript/CanvasProduct.js') }}"></script>
	<script src="{{ url_for('static', filename='javascript/Cart.js') }}"></script>
</head>
<body>
	<label type="text" id="CartIconQty"> </label>
	<a href="{{ url_for('Cart') }}">
	<img src="{{ url_for('static', filename='Cart.png') }}" id="CartIcon"></a>
    <form method="post">
		<table>
			<tr>
				<td>
					<img src="{{ url_for('static', filename='Canvas.jpg') }}" alt="Canvas">
				</td>
				<td>
					<h3>6 Pack 12" x 16" Super Value Canvas by Artist's Loft</h3>
					<label id="Canvasmsg">{{ msg }}</label><br>
					<select id="cmbCanvaQty" name="cmbCanvaQty">
						<option value="1">1</option>
						<option value="2">2</option>
						<option value="3">3</option>
						<option value="4">4</option>
						<option value="5">5</option>
						<option value="6">6</option>
					</select> 
					<h4>$16.99</h4>
					<p><b>Description</b></p>
				</td>
			</tr>
			<tr>
				<td>
					<button id="btnCartCanvas" type="submit">Add to Cart</button>
				</td>
			</tr>
		</table>
    </form>
</body>
</html>
